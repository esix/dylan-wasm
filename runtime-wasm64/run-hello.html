<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dylan → WebAssembly</title>
<style>
  body { background:#0d1117; color:#c9d1d9; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
         margin:0; padding:2rem; }
  h1 { font-size:1.4rem; color:#e6edf3; margin:0 0 .25rem; }
  .sub { color:#8b949e; margin-bottom:1.5rem; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:1rem 1.25rem; margin:0 0 1rem; max-width:820px; }
  .row { display:flex; gap:.6rem; align-items:baseline; padding:.15rem 0; }
  .ok::before  { content:"✅ "; } .work::before { content:"⚙️ "; } .stop::before { content:"⛔ "; }
  .k { color:#8b949e; min-width:200px; } .v { color:#e6edf3; }
  .stop-card { border-color:#9e6a03; }
  .ok-card { border-color:#238636; }
  pre { background:#0d1117; border:1px solid #30363d; border-radius:6px; padding:.75rem; overflow:auto; color:#c9d1d9; }
  .frame { color:#79c0ff; } .arrow { color:#8b949e; }
  .hello { color:#3fb950; font-size:1.2rem; white-space:pre-wrap; }
  small { color:#6e7681; }
</style>
</head>
<body>
<h1>Dylan → WebAssembly</h1>
<div class="sub">Open Dylan compiled to wasm64, running its own runtime in your browser.</div>
<div id="app">loading…</div>

<script type="module">
const app = document.getElementById('app');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
Error.stackTraceLimit = 100000;

let memory; const dec = new TextDecoder(); let dylanOut = '';
// Emscripten-style EH bridge (--enable-emscripten-cxx-exceptions on the Dylan
// bitcode). When Dylan code raises a condition, primitive_nlx in llvm-nlx.c
// calls _Unwind_RaiseException, which we routed through host_throw -> a JS
// throw. The throw propagates through wasm frames until one of the lowered
// `invoke_*` wrappers below catches it, sets __THREW__, and returns. The
// caller's landingpad code then calls __cxa_find_matching_catch_* (which
// just returns the thrown value here — Open Dylan dispatches catch clauses
// itself further up).
let instance;
let threwAddr = 0;            // address of C's __THREW__ in linear memory
let jsThrewValue = 0n;        // BigInt: the wasm64-sized exception pointer
class DylanThrow extends Error { constructor(exc) { super('dylan'); this.exc = exc; } }
function makeInvoke(name) {
  const isVoid = (name[7] === 'v');           // invoke_v… returns void
  return function (...all) {
    // wasm64: the function-table index arrives as a BigInt (i64) and must
    // stay BigInt — Table.get() rejects a Number on memory64 tables.
    const idx = all[0];
    const args = all.slice(1);
    try {
      return instance.exports.__indirect_function_table.get(idx)(...args);
    } catch (e) {
      if (e instanceof DylanThrow) {
        new Int32Array(memory.buffer)[threwAddr >>> 2] = 1;
        jsThrewValue = e.exc;
        return isVoid ? undefined : 0n;
      }
      throw e;
    }
  };
}
let tempRet0Addr = 0;       // address of C's tempRet0 in linear memory
function setTempRet0(v) { new Int32Array(memory.buffer)[tempRet0Addr >>> 2] = v | 0; }
const env = {
  host_write(fd, ptr, len) {
    dylanOut += dec.decode(new Uint8Array(memory.buffer, Number(ptr), Number(len)));
    return BigInt(Number(len));
  },
  host_throw(exc) { throw new DylanThrow(exc); },
  host_now_ns() { return BigInt(Math.floor(performance.now() * 1e6)); },
  // Open Dylan's exception object is a `struct dylan_bef`. Its layout
  // (from llvm-aarch64-darwin-runtime.h):
  //   bef_unwind_exception[4]  // 32 bytes (_Unwind_Exception)
  //   bef_frame_pointer        //  8 bytes
  //   bef_typeid               //  8 bytes  ← what catch clauses compare to
  //   ...
  // The personality function in llvm-nlx.c matches by `type == bef_typeid`,
  // i.e., the catch's typeinfo address equals the thrown bef's typeid. We
  // implement the same check here: read the i64 at exc+40 and compare to
  // the catch's typeinfo. tempRet0 holds the i32 selector that the
  // landingpad code compares against llvm_eh_typeid_for(@typeinfo) =
  // (i32)typeinfo. We always return the thrown value so `__resumeException`
  // can re-throw the original on mismatch.
  __cxa_find_matching_catch_2()  { setTempRet0(0); return jsThrewValue; },
  __cxa_find_matching_catch_3(t) {
    if (jsThrewValue !== 0n) {
      const thrownTypeid =
        new BigUint64Array(memory.buffer)[(Number(jsThrewValue) + 40) >>> 3];
      if (thrownTypeid === t) {
        setTempRet0(Number(t) & 0xFFFFFFFF);
        return jsThrewValue;
      }
    }
    setTempRet0(0);
    return jsThrewValue;
  },
};
['invoke_vj','invoke_vjjj','invoke_vjjjj','invoke_vjjjjj','invoke_vjjjjjj',
 'invoke_vjjjjjjj','invoke_vjjjjjjjj','invoke_vjjjjjjjjj','invoke_vjjjjjjjjjj',
 'invoke_jijj','invoke_jiji'].forEach(n => env[n] = makeInvoke(n));
const imports = { env };

const rows = items => items.map(([cls,k,v]) =>
  `<div class="row ${cls}"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');

(async () => {
  const t0 = performance.now();
  const buf = await (await fetch('hello.wasm')).arrayBuffer();
  const sizeMB = (buf.byteLength/1048576).toFixed(1);
  const { instance: inst } = await WebAssembly.instantiate(buf, imports);
  instance = inst;
  const e = instance.exports; memory = e.memory;
  threwAddr = Number(e.__THREW__?.value || 0n);
  tempRet0Addr = Number(e.tempRet0?.value || 0n);
  const loadMs = Math.round(performance.now() - t0);

  // Wire argv: write argc i64 pointers + NUL-terminated UTF-8 strings to a
  // safe high-memory address (256 MB), well above the bump allocator's
  // working region (__heap_base ≈ 35 MB) and below initial-memory (512 MB).
  // primitive_strlen does word-aligned reads, so each string must sit in
  // valid memory with at least 7 readable bytes before it — we 8-byte-align
  // every string for simplicity.
  const args = ["hello", "50000"];
  const argvBase = 0x10000000;
  const memU8 = new Uint8Array(memory.buffer);
  const memU64 = new BigUint64Array(memory.buffer);
  const enc = new TextEncoder();
  let strAddr = (argvBase + args.length * 8 + 7) & ~7;
  const argvPtrs = [];
  for (const a of args) {
    const bytes = enc.encode(a + '\0');
    memU8.set(bytes, strAddr);
    argvPtrs.push(BigInt(strAddr));
    strAddr = (strAddr + bytes.length + 7) & ~7;
  }
  for (let i = 0; i < argvPtrs.length; i++)
    memU64[(argvBase >>> 3) + i] = argvPtrs[i];

  let outcome, trace = '', cls = 'stop-card';
  try {
    // main(argc :: i32, argv :: i64). i32 needs a Number; i64 needs BigInt.
    const rc = e.main(args.length, BigInt(argvBase));
    outcome = ['ok','main returned', String(rc)]; cls = 'ok-card';
  } catch (err) {
    const frames = (err.stack||'').split('\n')
      .map(s => (s.match(/hello\.wasm\.([A-Za-z0-9_]+)/)||[])[1]).filter(Boolean);
    const oldest = frames.slice().reverse();
    const seen = new Set(); const chain = [];
    for (const f of oldest) {
      if (/dispatch_engine|discriminate|monomorphic|engine_node|secondary_dispatch|ponder|compute_/.test(f)) continue;
      if (!seen.has(f)) { seen.add(f); chain.push(f); }
      if (f === 'KputhashVKiI' || f === 'xep_2') break;
    }
    outcome = ['stop', 'current blocker', err.message + ' in <span class="frame">' + esc(frames[0]||'?') + '</span>'];
    trace = chain.map((f,i)=> (i? '<span class="arrow">→ </span>':'') + '<span class="frame">'+esc(f)+'</span>').join(' ');
  }

  const pipeline = [
    ['ok','Module fetched', `${sizeMB} MB &nbsp;<small>(${loadMs} ms)</small>`],
    ['ok','Instantiated', `wasm64 (memory64), ${memory.buffer.byteLength/1048576} MB memory`],
    ['ok','Exports', `${Object.keys(e).length.toLocaleString()} functions`],
    ['ok','Runtime entered', `main → __wasm_call_ctors → _Init_dylan_`],
    ['work','Library init', `running…`],
    outcome,
  ];

  document.title = cls==='ok-card' ? 'Dylan/wasm ✓' : 'Dylan/wasm — booting';
  app.innerHTML =
    `<div class="card ${cls}">${rows(pipeline)}</div>` +
    (dylanOut ? `<div class="card ok-card"><div class="k">Dylan output</div><div class="hello">${esc(dylanOut)}</div></div>` : '') +
    (trace ? `<div class="card"><div class="k" style="margin-bottom:.4rem">How far it got (init chain)</div><pre>${trace}</pre>
              <small>The runtime boots and runs in-browser up to this point — the remaining gap is a type-check in symbol-table init.</small></div>` : '');
})().catch(err => { app.innerHTML = `<div class="card stop-card"><div class="row stop"><span class="v">harness error: ${esc(String(err))}</span></div></div>`; });
</script>
</body>
</html>
